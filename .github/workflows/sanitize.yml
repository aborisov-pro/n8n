name: Sanitize workflow exports

on:
  push:
    branches:
      - chore/sanitize-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize JSON exports
        shell: pwsh
        run: ./scripts/sanitize_workflows.ps1

      - name: Commit sanitized exports
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sanitize workflow exports"
          git push
